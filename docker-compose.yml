services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      CLAIMS_LLM_PROVIDER: fake
      CLAIMS_CHECKPOINTER: memory
      CLAIMS_LOG_LEVEL: INFO
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 8

  ui:
    build: .
    command: streamlit run ui/dashboard.py --server.port 8501 --server.address 0.0.0.0
    environment:
      CLAIMS_API_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      - api

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: claims
      POSTGRES_PASSWORD: claims
      POSTGRES_DB: claims
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claims -d claims"]
      interval: 10s
      timeout: 5s
      retries: 8
