[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "claims-agents"
version = "0.1.0"
description = "Multi-agent LangGraph system for insurance claims triage, coverage, fraud, and reserves."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Navneeth Jadav" }]
keywords = ["insurance", "claims", "langgraph", "fraud", "llm", "agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "joblib>=1.4",
    "langgraph>=1.0,<2",
    "numpy>=1.26",
    "opentelemetry-api>=1.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "rank-bm25>=0.2.2",
    "scikit-learn>=1.5,<1.10",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
openai = ["openai>=1.50"]
anthropic = ["anthropic>=0.34"]
postgres = ["psycopg[binary]>=3.2", "langgraph-checkpoint-postgres>=2.0"]
ui = ["streamlit>=1.39"]
dev = [
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.8",
]

[project.scripts]
claims-api = "claims_agents.api.app:main"
claims-eval = "claims_agents.evals.__main__:main"

[project.urls]
Homepage = "https://github.com/Navneethsnehal/insurance-claims-agents"
Documentation = "https://github.com/Navneethsnehal/insurance-claims-agents/blob/main/docs/architecture.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
claims_agents = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "ui", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["claims_agents"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["claims_agents"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
strict_equality = true
show_error_codes = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "langgraph.*",
    "rank_bm25.*",
    "opentelemetry.*",
    "sklearn.*",
    "joblib.*",
    "streamlit.*",
]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["claims_agents"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
